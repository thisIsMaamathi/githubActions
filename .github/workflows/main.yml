name: Build and run test

on:
  push:
    branches:
      - testing

jobs:
  workflowda:
    strategy:
      matrix:
        node: [16, 18]
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{matrix.node}}

      - name: checkout code
        uses: actions/checkout@v3

      - name: Build code
        run: npm ci
        working-directory: exercise

      - name: Runs tests
        run: npm run test
        working-directory: exercise

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: app-builduh
          path: ./dist
