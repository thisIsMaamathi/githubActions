name: Build and run test

on:
  push:
    branches:
      - testing

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: checkout code
        uses: actions/checkout@v3

      - name: Build code
        run: npm ci
        working-directory: exercise

      - name: Runs tests
        run: npm run test
        working-directory: exercise
